<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first (adapts to dark tabs); PNG for browsers without SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The hero waits for this font before animating (capped at 800ms), so start
         downloading it during HTML parse rather than after the CSS is applied. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2"
    />
    <title>Rishi Negi, full-stack engineer in London</title>
    <!-- Condensed from `story` in src/content.ts (~160 chars, the length search results show). -->
    <meta
      name="description"
      content="Full-stack engineer in London, building with AI coding agents. Former production support engineer who likes understanding how things work."
    />

    <link rel="canonical" href="https://www.rishinegi.com/" />
    <!-- Link previews (LinkedIn, Slack, X). og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Rishi Negi, full-stack engineer in London" />
    <meta
      property="og:description"
      content="Full-stack engineer in London, building with AI coding agents. Former production support engineer who likes understanding how things work."
    />
    <meta property="og:url" content="https://www.rishinegi.com/" />
    <meta property="og:image" content="https://www.rishinegi.com/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rishi Negi. Full-stack engineer, building with AI coding agents, with a teal pen loop drawn around AI coding agents. rishinegi.com"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rishi Negi, full-stack engineer in London" />
    <meta
      name="twitter:description"
      content="Full-stack engineer in London, building with AI coding agents. Former production support engineer who likes understanding how things work."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
