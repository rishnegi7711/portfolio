<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The hero waits for this font before animating (capped at 800ms), so start
         downloading it during HTML parse rather than after the CSS is applied. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2"
    />
    <title>Rishi Negi — Frontend Engineer, London</title>
    <!-- Condensed from `story` in src/content.ts (~160 chars, the length search results show). -->
    <meta
      name="description"
      content="Frontend engineer in London (React + TypeScript), growing into full-stack. Former production support engineer who likes understanding how things work."
    />

    <!-- Link previews (LinkedIn, Slack, X). No og:image yet. -->
    <!-- TODO: replace og:url with the real Vercel URL after the first deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Rishi Negi — Frontend Engineer, London" />
    <meta
      property="og:description"
      content="Frontend engineer in London (React + TypeScript), growing into full-stack. Former production support engineer who likes understanding how things work."
    />
    <meta property="og:url" content="https://REPLACE-ME.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rishi Negi — Frontend Engineer, London" />
    <meta
      name="twitter:description"
      content="Frontend engineer in London (React + TypeScript), growing into full-stack. Former production support engineer who likes understanding how things work."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
